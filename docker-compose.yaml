version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: obeo-rooms-frontend
    container_name: obeo-rooms-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Add other frontend env variables here as needed:
      # - NEXT_PUBLIC_API_URL=http://api.obeorooms.com
